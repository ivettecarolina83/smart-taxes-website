name: Update IRS news

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-irs-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official IRS Newsroom
        run: node scripts/update-irs-news.mjs
      - name: Commit verified changes
        run: |
          if git diff --quiet -- data/irs-news.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/irs-news.json
          git commit -m "Actualiza noticias oficiales del IRS"
          git push
